<template>
    <lightning-card title="getPicklistValues Adapter with Industry">
        <div class="slds-p-around_medium">
            <lightning-combobox
            name="Industry"
            label="Industry"
            value={selectedIndustry}
            placeholder="Select Industry"
            options={industryOptions}
            onchange={handleChange} ></lightning-combobox>
        </div>
        <p class="slds-m-left_medium">Selected Industry - {selectedIndustry}</p>
    </lightning-card>

    <div class="slds-p-top_small"></div>
    <lightning-card title="getPicklistValues Adapter with Type">
        <div class="slds-p-around_medium">
            <lightning-combobox
            name="Type"
            label="Type"
            value={selectedType}
            placeholder="Select Type"
            options={typeOptions}
            onchange={handleTypeChange} ></lightning-combobox>
        </div>
        <p class="slds-m-left_medium">Selected Type - {selectedType}</p>
    </lightning-card>
</template>
