<template>
    <lightning-card title="Navigate to New Record">
        <div class="slds-m-around_medium">
            <lightning-button variant="brand" label="New Record" onclick={navigateToNewRecord}></lightning-button>
        </div>
    </lightning-card>
    
    <div class="slds-m-top_medium"></div>
    <lightning-card title="Navigate to New Record with Default Values">
        <div class="slds-m-around_medium">
            <lightning-button variant="brand" label="New Record (Default Values)" onclick={navigateToNewRecordWithDefault}></lightning-button>
        </div>
    </lightning-card>

    <div class="slds-m-top_medium"></div>
    <lightning-card title="Navigate to List View">
        <div class="slds-m-around_medium">
            <lightning-button variant="brand" label="Navigate List View" onclick={navigateToListView}></lightning-button>
        </div>
    </lightning-card>
</template>
