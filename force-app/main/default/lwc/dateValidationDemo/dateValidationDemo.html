<template>
    <lightning-card title="Date Validation Demo">
        <div class="slds-p-around_medium">
            <lightning-input type="date" name="startDate" label="Start Date" onchange={dateHandler}></lightning-input>
            <lightning-input type="date" name="endDate" label="End Date" onchange={dateHandler} class="slds-m-bottom_small"></lightning-input>

            <template if:true={error}>
                <p class="slds-text-color_error slds-p-bottom_small">{error}</p>
            </template>

            <lightning-button variant="brand" label="Submit" onclick={submitHandler}></lightning-button>
        </div>
    </lightning-card>
</template>
