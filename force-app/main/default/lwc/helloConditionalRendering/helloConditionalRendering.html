<template>
    <lightning-card title="Conditional Rendering">
        <div class="slds-m-around_medium">
            <lightning-button variant="brand" label="Show Data" title="Show Data" onclick={handleClick} class="slds-m-left_x-small">
            </lightning-button>
            <template if:true={isVisible}>
                <div class="slds-p-around_medium">Welcome to Zero to Hero in LWC Training</div>
            </template>
            <template if:false={isVisible}>
                <div class="slds-p-around_medium">Loading...</div>
            </template>

            <lightning-input type="text" label="Type Hello to see the data" onkeyup={changeHandler} class="slds-p-top_small"></lightning-input>
            <template if:true={typeMethod}>
                <div class="slds-p-around_medium">You have typed correctly</div>
            </template>
        </div>
    </lightning-card>
</template>
