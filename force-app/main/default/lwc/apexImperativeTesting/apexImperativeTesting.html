<template>
    <lightning-card title="Apex Imperative Method Testing" icon-name="custom:custom14">
        <div class="slds-m-around_medium">
            <lightning-button label="Load Accounts" onclick={loadAccountHandler}></lightning-button>
        </div>
        <div class="slds-m-around_medium">
        <template if:true={accounts}>
            <template for:each={accounts} for:item="account">
                <p key={account.Id} class="firstPara">{account.Name}</p>
            </template>
        </template>
        <template if:true={error}>
            <p class="error">{error}</p>
        </template>
    </div>
    </lightning-card>
</template>
