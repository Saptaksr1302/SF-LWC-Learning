<template>
    <c-p2c-alert-component message = "Welcome..." card-title="Parent to Child Primitive Data Communication" number=20 is-valid=false></c-p2c-alert-component>

    <div class="slds-m-bottom_medium"></div>
    <c-p2c-carousel-component carousel-details={carouselData}></c-p2c-carousel-component>
    
    <div class="slds-m-bottom_medium"></div>
    <lightning-card title="Parent to Child Communication on Action">
        <div class="slds-m-around_medium">
            <lightning-input type="number" label="Enter percentage" onkeyup={changeHandler}
            value={percentage} class="slds-m-bottom_small"></lightning-input>
            <c-p2c-progress-component progress-value={percentage}></c-p2c-progress-component>
        </div>
    </lightning-card>
    
    <div class="slds-m-bottom_medium"></div>
    <lightning-card>
        <lightning-button variant="brand" label="Reset Slider" onclick={handleClick} class="slds-m-left_medium"></lightning-button>
    </lightning-card>
    
    <c-p2c-slider-component></c-p2c-slider-component>
</template>
