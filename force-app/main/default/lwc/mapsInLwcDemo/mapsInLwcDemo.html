<template>
    <div class="slds-box">
        <template if:true={mapMarker.length}>
            <lightning-map map-markers={mapMarker} markers-title={markersTitle} onmarkerselect={callMarkerHandler} selected-marker-value={selectedMarker}></lightning-map>
        </template>
        <template if:false={mapMarker.length}>
            <div>No Account Found!!!</div>
        </template>
    </div>
</template>
