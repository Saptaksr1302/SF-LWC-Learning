<template>
    <lightning-card title="User Permission Demo">
        <template if:true={hasViewAllDataAvailable}>
            <p class="slds-m-left_medium">Yeah, I have a user permission</p>
        </template>
        <template if:false={hasViewAllDataAvailable}>
            <p class="slds-m-left_medium">Ohh, I don't have a user permission</p>
        </template>
    </lightning-card>
    
    <div class="slds-m-top_small"></div>
    <lightning-card title="Custom Permission Demo">
        <template if:true={hasCustomPermission}>
            <p class="slds-m-left_medium">Yeah, I have a custom permission</p>
        </template>
        <template if:false={hasCustomPermission}>
            <p class="slds-m-left_medium">Ohh, I don't have a custom permission</p>
        </template>
    </lightning-card>
</template>
