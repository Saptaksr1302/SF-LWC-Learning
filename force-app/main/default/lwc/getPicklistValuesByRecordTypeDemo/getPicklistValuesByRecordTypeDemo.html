<template>
    <lightning-card title="getPicklistValuesByRecordType Adapter">
        <div class="slds-p-around_medium">
            <template if:true={ratingOptions}>
                <lightning-combobox name="rating" label="Rating" value={selectedRating} placeholder="Select Rating" options={ratingOptions} onchange={handleChange}></lightning-combobox>
                <p class="slds-p-left_medium slds-m-top_small">Selected Rating - {selectedRating}</p>
            </template>
            
            <template if:true={industryOptions}>
                <lightning-combobox name="industry" label="Industry" value={selectedIndustry} placeholder="Select Industry" options={industryOptions} onchange={handleChange}></lightning-combobox>
                <p class="slds-p-left_medium slds-m-top_small">Selected Industry - {selectedIndustry}</p>
            </template>
        </div>
    </lightning-card>
</template>
